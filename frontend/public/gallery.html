<!DOCTYPE html>
<html>
<head>
  <title>Golden Sky Image Gallery Inspector</title>
  <style>
    body { font-family: sans-serif; background: #faf8f5; padding: 20px; }
    h1 { color: #d4af37; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { background: white; border: 1px solid #ddd; border-radius: 8px; overflow: hidden; padding: 10px; text-align: center; }
    img { width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
    .name { font-size: 14px; margin-top: 10px; font-weight: bold; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Image Gallery Inspector</h1>
  <div class="grid" id="gallery"></div>
  <script>
    const container = document.getElementById('gallery');
    fetch('http://localhost:5000/api/raw-images-list')
      .then(res => res.json())
      .then(images => {
        images.forEach(img => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="http://localhost:5000/raw-images/${img}" alt="${img}" loading="lazy">
            <div class="name">${img}</div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => {
        container.innerHTML = `<div style="color: red; grid-column: 1/-1;">Error loading images: ${err.message}. Make sure the backend server is running on port 5000!</div>`;
      });
  </script>
</body>
</html>
